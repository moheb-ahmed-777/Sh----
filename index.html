<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 For You 💖</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;600;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: #0a0015;
      transition: background 2s ease;
      cursor: default;
    }

    body.active {
      background: radial-gradient(ellipse at center, #2d0a1f 0%, #1a0010 50%, #0a0015 100%);
    }

    #root {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* ===== STARRY BACKGROUND ===== */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle ease-in-out infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* ===== START SCREEN ===== */
    .start-screen {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 40px;
      animation: fadeIn 2s ease;
    }

    .start-title {
      font-family: 'Great Vibes', cursive;
      font-size: 5rem;
      color: #fff;
      text-shadow:
        0 0 20px rgba(255, 107, 157, 0.8),
        0 0 40px rgba(255, 0, 110, 0.5),
        0 0 60px rgba(255, 0, 110, 0.3);
      animation: floatSoft 4s ease-in-out infinite;
      text-align: center;
      padding: 0 20px;
    }

    .start-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: rgba(255, 200, 220, 0.9);
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: fadeIn 3s ease;
    }

    .magic-btn {
      position: relative;
      padding: 22px 70px;
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #ff006e, #c9184a, #ff4d6d);
      background-size: 200% 200%;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        0 10px 40px rgba(255, 0, 110, 0.5),
        0 0 60px rgba(255, 107, 157, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.2);
      transition: all 0.5s ease;
      animation: gradientShift 4s ease infinite, pulse 3s ease-in-out infinite;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .magic-btn:hover {
      transform: translateY(-5px) scale(1.08);
      box-shadow:
        0 20px 60px rgba(255, 0, 110, 0.7),
        0 0 100px rgba(255, 107, 157, 0.5),
        inset 0 0 30px rgba(255, 255, 255, 0.3);
    }

    .magic-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: rotate(45deg);
      animation: shine 3s infinite;
    }

    .hint {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: rgba(255, 200, 220, 0.7);
      font-size: 1rem;
      letter-spacing: 2px;
      animation: blink 2.5s ease-in-out infinite;
    }

    /* ===== LOVE SCREEN ===== */
    .love-screen {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 2s ease;
      z-index: 5;
    }

    .love-text {
      font-family: 'Great Vibes', cursive;
      font-size: 7rem;
      color: #fff;
      text-shadow:
        0 0 30px rgba(255, 255, 255, 0.9),
        0 0 60px rgba(255, 107, 157, 1),
        0 0 90px rgba(255, 0, 110, 0.8),
        0 5px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: -20px;
      animation: textAppear 2s ease forwards, glow 3s ease-in-out infinite;
      z-index: 10;
      letter-spacing: 4px;
    }

    .big-heart-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: heartAppear 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
      z-index: 10;
    }

    .big-heart {
      width: 300px;
      height: 300px;
      filter:
        drop-shadow(0 0 50px rgba(255, 0, 110, 0.9)) drop-shadow(0 0 100px rgba(255, 107, 157, 0.7)) drop-shadow(0 0 150px rgba(255, 0, 110, 0.5));
      animation: heartbeat 1.4s ease-in-out infinite 2s;
    }

    /* Light rings around heart */
    .heart-ring {
      position: absolute;
      border: 2px solid rgba(255, 107, 157, 0.5);
      border-radius: 50%;
      animation: ringPulse 3s ease-out infinite;
    }

    .heart-ring:nth-child(1) {
      width: 350px;
      height: 350px;
      animation-delay: 0s;
    }

    .heart-ring:nth-child(2) {
      width: 450px;
      height: 450px;
      animation-delay: 1s;
    }

    .heart-ring:nth-child(3) {
      width: 550px;
      height: 550px;
      animation-delay: 2s;
    }

    .subtitle {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #ffd1dc;
      margin-top: 30px;
      text-shadow: 0 0 20px rgba(255, 209, 220, 0.8);
      opacity: 0;
      animation: subtitleAppear 2s ease 2.5s forwards;
      z-index: 10;
      letter-spacing: 2px;
    }

    .rotating-message {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: rgba(255, 200, 220, 0.9);
      margin-top: 20px;
      opacity: 0;
      animation: subtitleAppear 2s ease 3s forwards, fadeMessages 12s ease-in-out 3s infinite;
      z-index: 10;
      letter-spacing: 2px;
      text-align: center;
      padding: 0 20px;
    }

    /* ===== FALLING ELEMENTS ===== */
    .falling-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .falling-heart {
      position: absolute;
      top: -50px;
      animation: fall linear forwards;
      filter: drop-shadow(0 0 10px rgba(255, 107, 157, 0.8));
    }

    .petal {
      position: absolute;
      top: -50px;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 30% 30%, #ff8fab, #ff006e);
      border-radius: 150% 0 150% 0;
      animation: fallPetal linear forwards;
      opacity: 0.8;
      filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.6));
    }

    /* ===== SPARKLES ===== */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      box-shadow:
        0 0 10px #fff,
        0 0 20px #ff6b9d,
        0 0 30px #ff006e;
      animation: sparkle 3s ease-in-out infinite;
      pointer-events: none;
    }

    /* ===== MOUSE TRAIL ===== */
    .trail-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: trailFade 1.5s ease-out forwards;
    }

    /* ===== FLOATING HEARTS BG ===== */
    .bg-heart {
      position: absolute;
      color: rgba(255, 107, 157, 0.15);
      animation: floatUp linear infinite;
      filter: blur(1px);
    }

    /* ===== RESET BUTTON ===== */
    .reset-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.4s ease;
      z-index: 100;
      opacity: 0;
      animation: fadeIn 1s ease 4s forwards;
      letter-spacing: 1px;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
    }

    /* ===== SIGNATURE ===== */
    .signature {
      position: absolute;
      bottom: 30px;
      left: 30px;
      font-family: 'Great Vibes', cursive;
      font-size: 1.5rem;
      color: rgba(255, 200, 220, 0.6);
      opacity: 0;
      animation: fadeIn 1s ease 4s forwards;
      z-index: 100;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes floatSoft {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }
    }

    @keyframes gradientShift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%) translateY(-100%) rotate(45deg);
      }

      100% {
        transform: translateX(100%) translateY(100%) rotate(45deg);
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes heartAppear {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
      }

      50% {
        transform: scale(1.3) rotate(10deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
      }

      10% {
        transform: scale(1.12);
      }

      20% {
        transform: scale(1);
      }

      30% {
        transform: scale(1.08);
      }

      40% {
        transform: scale(1);
      }
    }

    @keyframes textAppear {
      0% {
        opacity: 0;
        transform: translateY(-80px) scale(0.5);
        letter-spacing: 20px;
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        letter-spacing: 4px;
      }
    }

    @keyframes subtitleAppear {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {

      0%,
      100% {
        text-shadow:
          0 0 30px rgba(255, 255, 255, 0.9),
          0 0 60px rgba(255, 107, 157, 1),
          0 0 90px rgba(255, 0, 110, 0.8);
      }

      50% {
        text-shadow:
          0 0 40px rgba(255, 255, 255, 1),
          0 0 80px rgba(255, 107, 157, 1),
          0 0 120px rgba(255, 0, 110, 1);
      }
    }

    @keyframes ringPulse {
      0% {
        transform: scale(0.8);
        opacity: 0.8;
        border-color: rgba(255, 107, 157, 0.8);
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
        border-color: rgba(255, 107, 157, 0);
      }
    }

    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg) scale(0.5);
        opacity: 0;
      }

      10% {
        opacity: 1;
        transform: translateY(0) rotate(30deg) scale(1);
      }

      90% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(100vh) rotate(720deg) scale(0.8);
        opacity: 0;
      }
    }

    @keyframes fallPetal {
      0% {
        transform: translateY(-50px) translateX(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.9;
      }

      100% {
        transform: translateY(100vh) translateX(100px) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes sparkle {

      0%,
      100% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }

      50% {
        opacity: 1;
        transform: scale(1.5) rotate(180deg);
      }
    }

    @keyframes trailFade {
      0% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

      100% {
        opacity: 0;
        transform: scale(0.3) translateY(-50px);
      }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.3;
      }

      90% {
        opacity: 0.3;
      }

      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes fadeMessages {

      0%,
      20% {
        opacity: 1;
      }

      25%,
      45% {
        opacity: 0;
      }

      50%,
      70% {
        opacity: 1;
      }

      75%,
      95% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .start-title {
        font-size: 3rem;
      }

      .magic-btn {
        padding: 16px 40px;
        font-size: 0.95rem;
        letter-spacing: 2px;
      }

      .love-text {
        font-size: 4rem;
      }

      .big-heart-wrapper {
        width: 220px;
        height: 220px;
      }

      .big-heart {
        width: 200px;
        height: 200px;
      }

      .subtitle {
        font-size: 1.6rem;
      }

      .rotating-message {
        font-size: 1rem;
      }

      .heart-ring:nth-child(1) {
        width: 250px;
        height: 250px;
      }

      .heart-ring:nth-child(2) {
        width: 320px;
        height: 320px;
      }

      .heart-ring:nth-child(3) {
        width: 390px;
        height: 390px;
      }
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ===== Romantic Messages =====
    const LOVE_MESSAGES = [
      "You are my today and all of my tomorrows",
      "In you, I found my home",
      "My heart beats only for you",
      "You are the poem I never knew how to write",
      "Every love story is beautiful, but ours is my favorite",
      "You are my sun, my moon, and all my stars",
      "Forever isn't long enough with you",
    ];

    // ===== Heart SVG with gradient =====
    const Heart = ({ size = 100, gradientId = "heartGrad" }) => (
      <svg viewBox="0 0 24 24" width={size} height={size}>
        <defs>
          <linearGradient id={gradientId} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#ff4d6d" />
            <stop offset="50%" stopColor="#ff006e" />
            <stop offset="100%" stopColor="#c9184a" />
          </linearGradient>
        </defs>
        <path fill={`url(#${gradientId})`} d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
             2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
             C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
             c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    );

    // ===== Small heart for falling =====
    const SmallHeart = ({ size = 20, color = "#ff006e" }) => (
      <svg viewBox="0 0 24 24" width={size} height={size} fill={color}>
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
             2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
             C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
             c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    );

    // ===== Starry Background =====
    const StarryBackground = () => {
      const [stars] = useState(() =>
        Array.from({ length: 100 }, (_, i) => ({
          id: i,
          top: Math.random() * 100,
          left: Math.random() * 100,
          size: Math.random() * 3 + 1,
          duration: Math.random() * 3 + 2,
          delay: Math.random() * 3,
        }))
      );

      return (
        <div className="stars">
          {stars.map(s => (
            <div
              key={s.id}
              className="star"
              style={{
                top: `${s.top}%`,
                left: `${s.left}%`,
                width: `${s.size}px`,
                height: `${s.size}px`,
                animationDuration: `${s.duration}s`,
                animationDelay: `${s.delay}s`,
              }}
            />
          ))}
        </div>
      );
    };

    // ===== Floating BG Hearts =====
    const FloatingHearts = () => {
      const [hearts] = useState(() =>
        Array.from({ length: 15 }, (_, i) => ({
          id: i,
          left: Math.random() * 100,
          size: Math.random() * 40 + 20,
          duration: Math.random() * 15 + 15,
          delay: Math.random() * 10,
        }))
      );

      return (
        <div className="falling-layer" style={{ zIndex: 1 }}>
          {hearts.map(h => (
            <div
              key={h.id}
              className="bg-heart"
              style={{
                left: `${h.left}%`,
                animationDuration: `${h.duration}s`,
                animationDelay: `${h.delay}s`,
              }}
            >
              <SmallHeart size={h.size} color="rgba(255, 107, 157, 0.3)" />
            </div>
          ))}
        </div>
      );
    };

    // ===== Falling Hearts Rain =====
    const HeartRain = () => {
      const [hearts, setHearts] = useState([]);

      useEffect(() => {
        const colors = ['#ff006e', '#ff4d94', '#ff6b9d', '#ff8fab', '#ffb3c6', '#ffffff', '#ffd1dc'];
        const sizes = [15, 20, 25, 30, 35, 40, 45];

        const createHeart = () => {
          const newHeart = {
            id: Date.now() + Math.random(),
            left: Math.random() * 100,
            size: sizes[Math.floor(Math.random() * sizes.length)],
            color: colors[Math.floor(Math.random() * colors.length)],
            duration: 5 + Math.random() * 5,
            delay: Math.random() * 2,
          };
          setHearts(prev => [...prev.slice(-50), newHeart]);

          setTimeout(() => {
            setHearts(prev => prev.filter(h => h.id !== newHeart.id));
          }, (newHeart.duration + newHeart.delay) * 1000);
        };

        for (let i = 0; i < 30; i++) {
          setTimeout(createHeart, i * 150);
        }

        const interval = setInterval(createHeart, 300);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="falling-layer">
          {hearts.map(heart => (
            <div
              key={heart.id}
              className="falling-heart"
              style={{
                left: `${heart.left}%`,
                animationDuration: `${heart.duration}s`,
                animationDelay: `${heart.delay}s`,
              }}
            >
              <SmallHeart size={heart.size} color={heart.color} />
            </div>
          ))}
        </div>
      );
    };

    // ===== Rose Petals =====
    const RosePetals = () => {
      const [petals, setPetals] = useState([]);

      useEffect(() => {
        const createPetal = () => {
          const newPetal = {
            id: Date.now() + Math.random(),
            left: Math.random() * 100,
            size: Math.random() * 15 + 10,
            duration: 6 + Math.random() * 6,
            delay: Math.random() * 2,
          };
          setPetals(prev => [...prev.slice(-30), newPetal]);

          setTimeout(() => {
            setPetals(prev => prev.filter(p => p.id !== newPetal.id));
          }, (newPetal.duration + newPetal.delay) * 1000);
        };

        for (let i = 0; i < 15; i++) {
          setTimeout(createPetal, i * 300);
        }

        const interval = setInterval(createPetal, 500);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="falling-layer" style={{ zIndex: 3 }}>
          {petals.map(p => (
            <div
              key={p.id}
              className="petal"
              style={{
                left: `${p.left}%`,
                width: `${p.size}px`,
                height: `${p.size}px`,
                animationDuration: `${p.duration}s`,
                animationDelay: `${p.delay}s`,
              }}
            />
          ))}
        </div>
      );
    };

    // ===== Sparkles =====
    const Sparkles = () => {
      const [sparkles, setSparkles] = useState([]);

      useEffect(() => {
        const createSparkle = () => {
          const s = {
            id: Date.now() + Math.random(),
            top: Math.random() * 100,
            left: Math.random() * 100,
            delay: Math.random() * 2,
          };
          setSparkles(prev => [...prev.slice(-40), s]);
        };

        const interval = setInterval(createSparkle, 150);
        return () => clearInterval(interval);
      }, []);

      return (
        <>
          {sparkles.map(s => (
            <div
              key={s.id}
              className="sparkle"
              style={{
                top: `${s.top}%`,
                left: `${s.left}%`,
                animationDelay: `${s.delay}s`,
              }}
            />
          ))}
        </>
      );
    };

    // ===== Mouse Trail =====
    const MouseTrail = () => {
      const [trail, setTrail] = useState([]);

      useEffect(() => {
        const handleMove = (e) => {
          const heart = {
            id: Date.now() + Math.random(),
            x: e.clientX,
            y: e.clientY,
          };
          setTrail(prev => [...prev.slice(-20), heart]);

          setTimeout(() => {
            setTrail(prev => prev.filter(h => h.id !== heart.id));
          }, 1500);
        };

        window.addEventListener('mousemove', handleMove);
        return () => window.removeEventListener('mousemove', handleMove);
      }, []);

      return (
        <>
          {trail.map(h => (
            <div
              key={h.id}
              className="trail-heart"
              style={{
                left: `${h.x - 10}px`,
                top: `${h.y - 10}px`,
              }}
            >
              <SmallHeart size={20} color="#ff6b9d" />
            </div>
          ))}
        </>
      );
    };

    // ===== Rotating Messages =====
    const RotatingMessages = () => {
      const [index, setIndex] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {
          setIndex(prev => (prev + 1) % LOVE_MESSAGES.length);
        }, 6000);
        return () => clearInterval(interval);
      }, []);

      return (
        <p className="rotating-message" key={index}>
          "{LOVE_MESSAGES[index]}"
        </p>
      );
    };

    // ===== Start Screen =====
    const StartScreen = ({ onClick }) => (
      <div className="start-screen">
        <h1 className="start-title">A Surprise For You</h1>
        <p className="start-subtitle">~ something special awaits ~</p>
        <button className="magic-btn" onClick={onClick}>
          💖 Open My Heart 💖
        </button>
        <p className="hint">✨ click to reveal what's inside ✨</p>
      </div>
    );

    // ===== Love Screen =====
    const LoveScreen = () => (
      <div className="love-screen">
        <FloatingHearts />
        <HeartRain />
        <RosePetals />
        <Sparkles />
        <MouseTrail />

        <h1 className="love-text">I Love You Shrouk 💖</h1>

        <div className="big-heart-wrapper">
          <div className="heart-ring"></div>
          <div className="heart-ring"></div>
          <div className="heart-ring"></div>
          <div className="big-heart">
            <Heart size={300} gradientId="mainHeartGrad" />
          </div>
        </div>

        <p className="subtitle">Forever & Always 💕</p>
        <RotatingMessages />
      </div>
    );

    // ===== Main App =====
    const App = () => {
      const [started, setStarted] = useState(false);

      const handleStart = () => {
        setStarted(true);
        document.body.classList.add('active');
      };

      const handleReset = () => {
        setStarted(false);
        document.body.classList.remove('active');
      };

      return (
        <>
          <StarryBackground />
          {started ? <LoveScreen /> : <StartScreen onClick={handleStart} />}
          {started && (
            <>
              <button className="reset-btn" onClick={handleReset}>
                ↺ start over
              </button>
              <div className="signature">with love 💖</div>
            </>
          )}
        </>
      );
    };

    // ===== Render =====
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>

</html>
